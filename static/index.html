<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🚗 Parking Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f9fb;
            --text-color: #333;
            --box-color: white;
        }

        body.dark-mode {
            --bg-color: #1c1c1c;
            --text-color: #f0f0f0;
            --box-color: #2e2e2e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        h1, h2 {
            font-size: 1.8em;
            margin-top: 30px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .camera-status {
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .status-online { background-color: #d4edda; color: #155724; }
        .status-paused { background-color: #fff3cd; color: #856404; }
        .status-idle { background-color: #d1ecf1; color: #0c5460; }
        .status-offline { background-color: #f8d7da; color: #721c24; }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buttons button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }

        .buttons button:hover {
            background-color: #0056b3;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            flex: 1 1 150px;
            padding: 20px;
            border-radius: 8px;
            background: var(--box-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-box h2 {
            margin: 0;
            font-size: 2em;
        }

        .stat-total { background-color: #e3e7ec; color: #000000 }
        .stat-occupied { background-color: #ffcccc; color: #b30000; }
        .stat-free { background-color: #ccffcc; color: #006600; }
        .stat-unknown { background-color: #ffffcc; color: #999900; }

        .preview-image {
            max-width: 600px;
            width: 100%;
            border: 4px solid #ccc;
            border-radius: 10px;
            margin-top: 10px;
        }

        #lastUpdated {
            font-size: 0.9em;
            color: #888;
        }

        textarea {
            width: 100%;
            font-family: monospace;
            font-size: 0.9em;
            background: var(--box-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }

        #configStatus {
            font-size: 0.9em;
            margin-left: 10px;
        }

        @media (max-width: 600px) {
            .stats, .status-bar, .buttons {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <h1>🚗 Parking Status Dashboard</h1>

    <div class="status-bar">
        <div id="cameraStatus" class="camera-status status-offline">Loading camera status...</div>

        <div class="buttons">
            <button onclick="sendCommand('start')">▶️ Start Detection</button>
            <button onclick="sendCommand('stop')">⏸️ Stop Detection</button>
            <button onclick="sendCommand('snapshot')">📸 Snapshot</button>
            <button onclick="toggleDarkMode()">🌓 Toggle Dark Mode</button>
            <button onclick="window.location.href='/define'">🛠️ Define Spots</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-box stat-total">
            <h2 id="totalCount">0</h2>
            <p>Total Spots</p>
        </div>
        <div class="stat-box stat-occupied">
            <h2 id="occupiedCount">0</h2>
            <p>Occupied</p>
        </div>
        <div class="stat-box stat-free">
            <h2 id="freeCount">0</h2>
            <p>Free</p>
        </div>
        <div class="stat-box stat-unknown">
            <h2 id="unknownCount">0</h2>
            <p>Unknown</p>
        </div>
    </div>

    <h2>📷 Latest Frame</h2>
    <img id="latestFrame" src="/latest_frame.jpg" alt="Latest Frame" class="preview-image"
         onerror="this.src='placeholder.jpg';">
    <p id="lastUpdated">Last updated: never</p>

    <h2>⚙️ Configuration Editor</h2>
    <textarea id="configEditor" rows="20" placeholder="Loading config..."></textarea>
    <div style="margin-top:10px;">
        <button onclick="loadConfig()">🔄 Load Config</button>
        <button onclick="saveConfig()">💾 Save Config</button>
        <span id="configStatus" style="color: green;"></span>
    </div>

    <script>
        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    const statuses = data.statuses || [];
                    const cameraStatus = data.camera_status || "offline";

                    const total = statuses.length;
                    const occupied = statuses.filter(s => s === true).length;
                    const free = statuses.filter(s => s === false).length;
                    const unknown = statuses.filter(s => s === null).length;

                    document.getElementById('totalCount').innerText = total;
                    document.getElementById('occupiedCount').innerText = occupied;
                    document.getElementById('freeCount').innerText = free;
                    document.getElementById('unknownCount').innerText = unknown;

                    const camStatusEl = document.getElementById('cameraStatus');
                    camStatusEl.textContent = `Camera Status: ${cameraStatus.toUpperCase()}`;
                    camStatusEl.className = 'camera-status status-' + cameraStatus;

                    document.getElementById('latestFrame').src = data.latest_frame_url;
                    document.getElementById('lastUpdated').textContent =
                        "Last updated: " + new Date().toLocaleTimeString();
                })
                .catch(err => {
                    console.error("Error fetching status:", err);
                    document.getElementById('cameraStatus').textContent = "Camera Status: ERROR";
                    document.getElementById('cameraStatus').className = 'camera-status status-offline';
                });
        }

        function sendCommand(cmd) {
            fetch('/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'success') {
                    alert("Error: " + data.message);
                } else {
                    alert("Command sent: " + data.command);
                }
            });
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        function loadConfig() {
            fetch('/config')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('configEditor').value = JSON.stringify(data, null, 2);
                    document.getElementById('configStatus').textContent = "Loaded config.";
                })
                .catch(err => {
                    console.error("Failed to load config:", err);
                    document.getElementById('configStatus').textContent = "Error loading config.";
                });
        }

        function saveConfig() {
            const raw = document.getElementById('configEditor').value;
            let json;
            try {
                json = JSON.parse(raw);
            } catch (e) {
                alert("Invalid JSON format!");
                return;
            }

            fetch('/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(json)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('configStatus').textContent = "Config saved.";
                } else {
                    document.getElementById('configStatus').textContent = "Save failed: " + data.message;
                }
            })
            .catch(err => {
                console.error("Save failed:", err);
                document.getElementById('configStatus').textContent = "Error saving config.";
            });
        }

        // Load config & status on page load
        window.onload = function () {
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
            }
            loadConfig();
            updateStatus();
            setInterval(updateStatus, 5000);
        };
    </script>

</body>
</html>
